services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    volumes: [./backend/data:/app/data]
    ports: ["8000:8000"]

  web:
    build: ./web
    depends_on: [backend]
    ports: ["8080:80"]

  platform-pg:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: insight
      POSTGRES_PASSWORD: insight
      POSTGRES_DB: insight
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  pgdata:
